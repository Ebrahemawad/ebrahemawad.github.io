name: Build Masar Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'masar-android/**'
      - '.github/workflows/build-masar-android.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: masar-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || exit 1
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -la "$SDK/platforms" || true
          ls -la "$SDK/build-tools" || true
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install missing SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$MANAGER" ]; then
              MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            fi
            test -x "$MANAGER"
            yes | "$MANAGER" --licenses >/dev/null || true
            "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename distributable
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Masar-Android-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Masar-Android-APK
          path: Masar-Android-v0.1.0-debug.apk
          if-no-files-found: error
      - name: Publish download as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if gh release view "masar-android-v0.1.0-debug" >/dev/null 2>&1; then
            gh release upload "masar-android-v0.1.0-debug" "Masar-Android-v0.1.0-debug.apk" --clobber
          else
            gh release create "masar-android-v0.1.0-debug" "Masar-Android-v0.1.0-debug.apk" --title "Masar Android v0.1.0 (Test APK)" --notes "Android test APK for Masar Shipping. Requires internet. Location sharing operates while the app is in the foreground. Do not treat this debug build as a production-grade delivery or guaranteed background tracking."
          fi
