name: Build Masar Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'masar-android/**'
      - '.github/workflows/build-masar-android.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: masar-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || exit 1
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -la "$SDK/platforms" || true
          ls -la "$SDK/build-tools" || true
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install missing SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$MANAGER" ]; then
              MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            fi
            test -x "$MANAGER"
            yes | "$MANAGER" --licenses >/dev/null || true
            "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Load original signing certificate if configured
        env:
          MASAR_KEYSTORE_BASE64: ${{ secrets.MASAR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$MASAR_KEYSTORE_BASE64" ]; then
            printf '%s' "$MASAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/masar-original.keystore"
            echo "MASAR_ORIGINAL_KEYSTORE=$RUNNER_TEMP/masar-original.keystore" >> "$GITHUB_ENV"
          else
            echo "Original signing key not configured. This build will NOT update the installed Android app."
          fi
      - name: Compile existing Masar Android app
        env:
          MASAR_STORE_PASSWORD: ${{ secrets.MASAR_STORE_PASSWORD }}
          MASAR_KEY_ALIAS: ${{ secrets.MASAR_KEY_ALIAS }}
          MASAR_KEY_PASSWORD: ${{ secrets.MASAR_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify same signing identity and application ID
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$SDK/build-tools/35.0.0/apksigner"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          test -x "$SIGNER"
          test -x "$AAPT"
          "$SIGNER" verify --print-certs "$APK"
          CERT=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED="5446421afab06e33c77aef8f7ac7047092958c3f7eff3529e114c3c8ff9cced9"
          PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          echo "Package ID: $PACKAGE"
          if [ "$PACKAGE" = "com.masar.shipping.debug" ] && [ "$CERT" = "$EXPECTED" ]; then
            echo "MATCHES_INSTALLED_APP=true" >> "$GITHUB_ENV"
            echo "Matching installed APK package and signing certificate."
          else
            echo "MATCHES_INSTALLED_APP=false" >> "$GITHUB_ENV"
            echo "::warning::This APK cannot update the installed APK. Matching package AND original signing key are required."
          fi
      - name: Export build for inspection
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Masar-Android-v0.2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Masar-Android-APK-signature-check-required
          path: Masar-Android-v0.2.0-debug.apk
          if-no-files-found: error
      - name: Publish only a verified in-place update
        if: env.MATCHES_INSTALLED_APP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if gh release view "masar-android-v0.2.0-debug" >/dev/null 2>&1; then
            gh release upload "masar-android-v0.2.0-debug" "Masar-Android-v0.2.0-debug.apk" --clobber
          else
            gh release create "masar-android-v0.2.0-debug" "Masar-Android-v0.2.0-debug.apk" --title "Masar Android v0.2.0 - verified in-place update" --notes "Signature and Android application ID verified against the user-supplied installed APK. Delivery reminders require Android notification permission and alarms configuration."
          fi
