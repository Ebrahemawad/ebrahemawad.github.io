function exportCompany(){var x=companyRows(state.company,state.date,'');exportRows('Masar_Company_Report_'+new Date().toISOString().slice(0,10),['اسم الشركة','رقم الشحنة','اسم المستلم','رقم الهاتف','عنوان التسليم','المنتج','الحالة','مبلغ الشحنة (جنيه)','المحصّل (جنيه)','مستحق الشركة (جنيه)'],x.map(function(s){return [byId('companies',s.company_id)?.name||'',s.tracking,s.customer,s.phone,s.address,s.product,statuses[s.status]||s.status,s.total/100,(s.collected||0)/100,companyDue(s)/100]}))}
function exportInternal(){var x=companyRows(state.company,state.date,'');exportRows('Masar_Internal_Report_'+new Date().toISOString().slice(0,10),['الشركة','الشحنة','المندوب','الحالة','المحصّل','التوصيل','نصيب المندوب','مستحق الشركة','عمولة الشركة','تاريخ الإنجاز'],x.map(function(s){return [byId('companies',s.company_id)?.name||'',s.tracking,byId('drivers',s.driver_id)?.name||'',statuses[s.status]||s.status,(s.collected||0)/100,s.delivery/100,s.driver_fee/100,companyDue(s)/100,['delivered','partial','returned_visit'].includes(s.status)?(s.delivery-s.driver_fee)/100:0,day(s.delivered)]}))}
async function startLocation(){if(!navigator.geolocation){toast('المتصفح لا يدعم تحديد المكان',true);return}if(state.watch!==null)return;var id=navigator.geolocation.watchPosition(async function(p){try{if(Date.now()-state.lastSent<25000)return;state.lastSent=Date.now();await call('location',{latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy});toast('تم تحديث موقعك')}catch(e){toast(errText(e),true)}},function(e){toast('تعذر الوصول للموقع: '+e.message,true)},{enableHighAccuracy:true,maximumAge:20000,timeout:25000});state.watch=id;draw()}
async function stopLocation(){if(state.watch!==null)navigator.geolocation.clearWatch(state.watch);state.watch=null;state.lastSent=0;try{await call('location_stop');toast('تم إيقاف مشاركة الموقع')}catch(e){toast(errText(e),true)}draw()}
document.addEventListener('submit',async function(e){if(e.target.id!=='login-form')return;e.preventDefault();if(!auth){toast('مكتبة تسجيل الدخول لم تحمّل',true);return}var m=new FormData(e.target),v=read(m,'login'),mail=/^[0-9]{4,12}$/.test(v)?'ebrahemawad22+masar.'+v+'@gmail.com':v;var b=e.target.querySelector('button');b.disabled=true;try{var res=await auth.auth.signInWithPassword({email:mail,password:read(m,'password')});if(res.error)throw res.error;state.session=res.data.session;await load(true)}catch(ex){toast('تعذّر تسجيل الدخول: '+errText(ex),true);b.disabled=false}});
document.addEventListener('click',async function(e){var t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;state.search='';state.selected.clear();draw();return}var b=e.target.closest('[data-act]');if(!b)return;var id=Number(b.dataset.id),act=b.dataset.act;try{
if(act==='reload'){await load(true);toast('تم التحديث');return}if(act==='logout'){await stopLocation().catch(function(){});await auth.auth.signOut();state.session=null;state.data=null;loginView();return}
if(act==='company')return handleCompany(id);if(act==='status')return handleStatus(id);if(act==='staff')return handleStaff(id);
if(act==='provision-driver')return provision('driver');if(act==='provision-manager')return provision('manager');
if(act==='driver-credential'){var d=byId('drivers',id);return d&&d.username?handlePassword(id,'driver'):provision('driver',id)}
if(act==='password-manager')return handlePassword(id,'manager');if(act==='driver-access')return driverAccess(id);
if(act==='payment'||act==='payment-driver')return payment('driver',id);
if(act==='payment-company')return payment('company',id);
if(act==='close-day')return closeDay();if(act==='cash')return cash();if(act==='import')return importDialog();
if(act==='assign'){var ids=Array.from(state.selected);if(!ids.length)throw Error('حدّد الشحنات أولًا');return openModal('تعيين '+ids.length+' شحنة لمندوب',sel('driverId','المندوب',opt('drivers')),async function(m){await call('assign',{ids:ids,driverId:Number(read(m,'driverId'))});state.selected.clear()})}
if(act==='reopen-day'){return openModal('إعادة فتح يوم','<p class="alert">ستُعاد إمكانية التحديثات لليوم الحالي فقط، مع حفظ سبب إعادة الفتح.</p>'+f('reason','سبب إعادة الفتح','text','','required'),function(m){return call('reopen_day',{id:id,reason:read(m,'reason')})})}
if(act==='export-shipments')return exportShipments();if(act==='export-company')return exportCompany();if(act==='export-internal')return exportInternal();
if(act==='location-start')return startLocation();if(act==='location-stop')return stopLocation();
if(act==='import-snapshot'){var file=document.getElementById('snapshot-file').files[0];if(!file)throw Error('اختر نسخة JSON');var snapshot=JSON.parse(await file.text());if(!confirm('هل تريد استيراد النسخة القديمة؟ لن يُسمح بالاستيراد على قاعدة بيانات غير فارغة.'))return;await call('import_snapshot',{snapshot:snapshot});await load(true);toast('تم نقل البيانات');return}
}catch(ex){toast(errText(ex),true)}
});
document.addEventListener('input',function(e){if(e.target.id==='search'){state.search=e.target.value;var pos=e.target.selectionStart;draw();var input=document.getElementById('search');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener('change',function(e){if(e.target.classList.contains('select-shipment')){var id=Number(e.target.dataset.id);if(e.target.checked)state.selected.add(id);else state.selected.delete(id)}else if(e.target.id==='filter-company'){state.company=e.target.value;draw()}else if(e.target.id==='filter-status'){state.status=e.target.value;draw()}else if(e.target.id==='report-from'){state.date=e.target.value;draw()}});
async function init(){if(!auth){root.textContent='تعذر تحميل أداة الدخول. تأكد من الاتصال بالإنترنت.';return}var s=await auth.auth.getSession();state.session=s.data.session;auth.auth.onAuthStateChange(function(event,session){if(event==='SIGNED_OUT'){state.session=null;state.data=null;state.watch=null;loginView()}else if(session){state.session=session}});if(state.session)await load(true);else loginView()}
init();
})();
</script>
</body></html>
