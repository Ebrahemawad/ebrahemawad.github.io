plugins {
    id 'com.android.application'
}
android {
    namespace 'com.masar.shipping'
    compileSdk 35
    defaultConfig {
        applicationId 'com.masar.shipping'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        // Optional signing key for an in-place update of the already installed app.
        // A new Android debug key cannot replace the original signing identity.
        existingInstall {
            def ks = System.getenv('MASAR_ORIGINAL_KEYSTORE')
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('MASAR_STORE_PASSWORD')
                keyAlias System.getenv('MASAR_KEY_ALIAS')
                keyPassword System.getenv('MASAR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
            // Only apply explicit original signing configuration when provided.
            // Otherwise this is a standalone development build, not an in-place update.
            if (System.getenv('MASAR_ORIGINAL_KEYSTORE')) {
                signingConfig signingConfigs.existingInstall
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
