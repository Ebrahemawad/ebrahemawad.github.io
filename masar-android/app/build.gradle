plugins {
    id 'com.android.application'
}
android {
    namespace 'com.masar.shipping'
    compileSdk 35
    defaultConfig {
        applicationId 'com.masar.shipping'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
